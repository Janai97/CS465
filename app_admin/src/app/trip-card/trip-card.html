<div class="card trip-card">

  <!-- Action Buttons (Top Right) -->
  <div class="card-actions" *ngIf="isLoggedIn()">
    <button
      type="button"
      class="edit-btn"
      (click)="editTrip(trip)"
    >
      Edit
    </button>

    <button
      type="button"
      class="delete-btn"
      (click)="deleteTrip(trip)"
    >
      ✕
    </button>
  </div>

  <img
    [src]="'assets/images/' + trip.image"
    alt="trip image"
    class="card-img-top"
  />

  <div class="card-body">
    <h5 class="card-title">{{ trip.name }}</h5>

    <p class="card-subtitle mb-2 text-muted">
      {{ trip.resort }}
    </p>

    <p class="card-subtitle mb-2 text-muted">
      {{ trip.length }}
    </p>

    <p class="card-subtitle mb-2 text-muted">
      {{ trip.perPerson | currency:'USD':'symbol' }} per person
    </p>

    <p class="card-text" [innerHTML]="trip.description"></p>
  </div>

</div>
